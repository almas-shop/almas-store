<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الماس | عمده‌فروشی لباس زنانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--red:#2563eb;--ink:#23254e;--mut:#81858b;--line:#e0e0e6;--bg:#f1f2f4}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn','Tahoma',sans-serif;line-height:1.7}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;cursor:pointer;white-space:nowrap}
body{background:linear-gradient(#eef4ff,#f8fafc) fixed}
.hd{background:linear-gradient(90deg,#1d4ed8,#3b82f6);color:#fff}
.hdi{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}
.lg{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.brand b{font-size:22px;font-weight:800;display:block;line-height:1.2}.brand small{font-size:12px;opacity:.85}
.cb{position:relative;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-size:16px}
.cb b{position:absolute;top:-6px;inset-inline-start:-6px;background:#f59e0b;color:#111;border-radius:10px;font-size:12px;min-width:20px;text-align:center;transition:transform .15s}
.shop{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.shi{display:flex;align-items:center;gap:12px;padding:12px 16px}
.av{width:44px;height:44px;border-radius:10px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:22px}
.shi b{font-size:17px;display:block;line-height:1.3}.shi small{color:var(--mut)}
.stories{display:flex;gap:16px;padding:16px 4px 6px;overflow-x:auto}
.sty{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;min-width:64px}
.sty i{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal}
.sty.on i{border-color:#f59e0b;box-shadow:0 0 0 3px #fef3c7}.sty.on span{font-weight:600;color:var(--red)}
.sb{display:flex;background:#e0e9ff;border:1px solid #c7d6fb;border-radius:14px;padding:4px;margin:14px 0 18px}
.sb input{flex:1;border:0;background:none;padding:10px 12px;outline:0}
.sb button{border:0;background:var(--red);color:#fff;width:42px;border-radius:10px;cursor:pointer}
h2.t{font-size:20px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(30,64,175,.08);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(30,64,175,.16)}
.im{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.im img,.mn img{width:100%;height:100%;object-fit:cover;display:block}
.dc{position:absolute;top:8px;inset-inline-end:8px;background:#e11d48;color:#fff;border-radius:20px;padding:0 9px;font-size:13px;font-weight:600}
.so{position:absolute;inset:auto 0 0 0;background:rgba(15,23,42,.7);color:#fff;text-align:center;font-size:13px;padding:3px}
.card h3{font-size:14px;font-weight:600;margin:10px 12px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
.pz{margin:0 12px;color:#16a34a;font-weight:800;font-size:16px}.pz small{font-weight:400;font-size:12px}.pz s{color:var(--mut);font-weight:400;font-size:12px}
.ft{margin:4px 12px 12px;display:flex;justify-content:space-between;color:var(--mut);font-size:12px}.ft em{color:#ea580c;font-style:normal;font-weight:600}
.pd{position:fixed;inset:0;background:linear-gradient(#eef4ff,#fff);z-index:15;display:none;overflow:auto}
.pd.show{display:block}
.pdi{max-width:1100px;margin:0 auto;padding:0 16px 100px}
.bk{margin:14px 0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer}
.pdg{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.mn{aspect-ratio:3/4;max-height:72vh;width:100%;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:110px}
.ths{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.th{border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;width:64px;height:64px;flex-shrink:0;cursor:pointer;background:#fff}
.th.on{border-color:var(--red)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.inf h1{font-size:24px;margin:0 0 10px}
.bd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bd span{padding:2px 12px;border-radius:20px;font-size:13px}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.dcb{background:#e11d48;color:#fff}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:12px}
.box .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9}.box .r:last-child{border:0}
.box .g{color:#16a34a;font-size:18px}.box s{color:var(--mut);font-size:13px;font-weight:400}
.ds{color:#475569;white-space:pre-line}
.sim{margin-top:28px}.sim h3{margin:0 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}.row .card{min-width:170px;max-width:170px}
.bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 16px;display:flex;align-items:center;gap:14px;justify-content:center}
.st{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px}.st button{width:38px;height:40px;border:0;background:none;font-size:20px;cursor:pointer}.st b{min-width:30px;text-align:center}
.ad{background:var(--red);color:#fff;border:0;border-radius:12px;padding:11px 28px;font-weight:600;cursor:pointer;flex:1;max-width:320px}.ad:disabled{background:#cbd5e1;cursor:not-allowed}
.it .e{overflow:hidden;flex-shrink:0}.it .e img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:760px){.pdg{grid-template-columns:1fr}.mn{max-height:60vh}}
.info{background:#fff;margin-top:40px;padding:30px 0;border-top:1px solid var(--line)}
.info .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;text-align:center}
.info b{display:block;color:var(--red);margin-bottom:2px}
.info span{color:var(--mut)}
footer{background:#fff;padding:16px 0 26px;color:var(--mut);font-size:14px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
.ov.show{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(420px,100%);background:#fff;z-index:10;display:none;flex-direction:column}
.drawer.show{display:flex}
.dh{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.items{flex:1;overflow:auto;padding:12px 16px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.it .e{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px}
.it .n{flex:1}
.q{display:flex;align-items:center;gap:6px}
.q button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.df{border-top:1px solid var(--line);padding:14px 16px}
.df input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;font-weight:800;margin:6px 0 10px}
.pay{width:100%;background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.inv{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.55);overflow:auto;padding:20px}
.inv.show{display:flex}
.paper{background:#fff;width:min(760px,100%);border-radius:12px;padding:28px}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.acts button{flex:1;min-width:130px;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.acts .p{background:var(--red);border-color:var(--red);color:#fff}
#paper .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;color:var(--mut);font-size:14px;margin:8px 0 12px;border-bottom:2px solid var(--red);padding-bottom:10px}
#paper .sh{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:2}
#paper .by{font-size:14px;margin-bottom:16px}
#paper table{width:100%;border-collapse:collapse;font-size:14px}
#paper th,#paper td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
#paper th:nth-child(2),#paper td:nth-child(2){text-align:start;white-space:normal}
#paper th{background:var(--bg)}
#paper .tw{overflow-x:auto}
#paper .sum{margin-top:16px;margin-inline-start:auto;width:min(320px,100%);font-size:15px}
#paper .sum div{display:flex;justify-content:space-between;gap:20px;padding:5px 0}
#paper .sum .g{font-weight:800;font-size:18px;color:var(--red);border-top:2px solid var(--red);margin-top:6px;padding-top:8px}
.stk{font-size:13px;color:var(--mut);margin-top:2px}
.stk.low{color:#e67e00;font-weight:600}
.stk.out{color:var(--red);font-weight:600}
.add:disabled{background:#c9cbd1;cursor:not-allowed;filter:none}
@media(max-width:640px){.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}}

/* ===== اصلاح نمایش موبایل ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.grid>.card{min-width:0}
@media(max-width:560px){
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .card h3{font-size:13px;margin:8px 10px 4px;min-height:40px}
 .pz{margin:0 10px;font-size:14px}
 .ft{margin:4px 10px 10px}
 .im{font-size:48px}
 .row .card{min-width:150px;max-width:150px}
 .hdi{padding:10px 12px}
 .brand b{font-size:19px}
 .sb input,.df input{font-size:16px}
}

/* ===== دکمه‌ی شناور سبد خرید ===== */
.cb{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:8;width:58px;height:58px;padding:0;border-radius:50%;background:#2563eb;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(37,99,235,.45)}
.cb b{top:-4px;inset-inline-start:-4px;border:2px solid #fff;min-width:22px;line-height:18px}

/* ===== چاپ فاکتور (فقط فاکتور چاپ می‌شود) ===== */
@media print{
 body>*:not(#inv){display:none!important}
 html,body{background:#fff!important;height:auto!important;overflow:visible!important}
 #inv{position:static!important;display:block!important;background:none!important;padding:0!important;overflow:visible!important}
 .paper{width:100%!important;border-radius:0!important;padding:0!important}
 .acts{display:none!important}
 #paper th{background:#f1f2f4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== اصلاح بزرگ‌نمایی صفحه‌ی محصول (آیفون) ===== */
.pdg>*{min-width:0}
.ths{max-width:100%}
.mn img{object-fit:contain}
@media(max-width:760px){.pdg{grid-template-columns:minmax(0,1fr)}}

/* ===== عکس همیشه داخل کادر خودش می‌ماند، مستقل از ابعاد اصلی عکس (سافاری آیفون) ===== */
.mn{position:relative}
.mn img,.im img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;max-width:none;max-height:none}
.mn img{object-fit:contain}

/* ===== جلوگیری قطعی از اسکرول افقی صفحه‌ی محصول، مهم نیست عکس چقدر بزرگ باشد ===== */
.pd{overflow-x:hidden}
.pdi{width:100%;overflow-x:hidden}
.pdg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pdg>*,.mn,.inf,.ths{min-width:0;max-width:100%}
img{max-width:100%}
@media(max-width:760px){.pdg{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="hd"><div class="wrap hdi">
<div class="brand"><span class="lg">💎</span><div><b>الماس</b><small>عمده‌فروشی پوشاک زنانه</small></div></div>
<button class="cb" onclick="openCart()">🛒<b id="n">۰</b></button>
</div></header>
<div class="shop"><div class="wrap shi"><div class="av">💎</div><div><b id="shn"></b><small>مدیریت: مرادی · فروش به‌صورت پک</small></div></div></div>
<div class="wrap">
<div class="stories" id="nav"></div>
<div class="sb"><input id="q" placeholder="جستجوی لباس در این فروشگاه..." oninput="draw()"><button onclick="draw()">🔍</button></div>
<h2 class="t" id="ttl">همه‌ی محصولات</h2>
<div class="grid" id="grid"></div>
</div>

<div class="info"><div class="wrap"><div class="g" id="info"></div></div></div>
<footer>© الماس · مدیریت: مرادی</footer>

<div class="pd" id="pd"><div class="pdi" id="pdi"></div></div>
<div class="ov" id="ov" onclick="closeCart()"></div>
<div class="drawer" id="dr">
<div class="dh"><span>سبد خرید</span><button class="btn" onclick="closeCart()">✕</button></div>
<div class="items" id="items"></div>
<div class="df">
<input id="cn" placeholder="نام خریدار / نام فروشگاه (برای فاکتور)">
<input id="cp" placeholder="شماره تماس">
<div class="tot"><span>مبلغ قابل پرداخت</span><span id="tt">۰</span></div>
<button class="pay" id="pay" onclick="invoice()">ثبت سفارش و نمایش فاکتور</button>
</div>
</div>

<div class="inv" id="inv"><div class="paper"><div id="paper"></div>
<div class="acts"><button class="p" onclick="printInv()">🖨 چاپ فاکتور</button><button onclick="editCart()">✏️ ویرایش سبد خرید</button><button onclick="done()">بستن و سفارش جدید</button></div></div></div>

<script>
// ===== اطلاعات مغازه: تولیدی و پخش پوشاک زنانه =====
// شماره‌ها را با | از هم جدا کن؛ هر کدام در یک خط جدا نمایش داده می‌شود
var S={name:'الماس',shop:'تولیدی الماس مرادی',address:'بازار بزرگ تهران بازار مسگرها کوچه خسروی پاساژ نیک پ1',phone:'علیرضا: 09331805391|پخش: 02155617531',hours:'9:00 الی 17:00'};
// ===== اتصال به گوگل شیت: آدرس وب‌اپ را بین کوتیشن‌ها بگذار. اگر خالی باشد سایت با داده‌ی نمونه و بدون اتصال کار می‌کند =====
var API_URL='https://script.google.com/macros/s/AKfycbzDaU9fI0kofUfbbS2XQ1XUlabiY32t3av2BaZtGIRZbaM3CzxS1msET6d9X1KroEtT/exec';
// ===== محصولات (فقط برای حالت بدون اتصال): [دسته، نام، قیمت هر عدد (تومان)، تعداد در هر پک، موجودی انبار (تعداد پک)، رنگ زمینه] =====
var C=['شلوار','مانتو','شومیز','بافت','کت'];
var E={'شلوار':'👖','مانتو':'🧥','شومیز':'👚','بافت':'🧶','کت':'🥼'};
var P=[
['شلوار','شلوار جین مام‌فیت',450000,6,24,'#e8f0ff'],
['شلوار','شلوار کتان راسته',380000,6,15,'#eaf7ee'],
['شلوار','شلوار پارچه‌ای دمپا',420000,4,3,'#f3eaff'],
['مانتو','مانتو اسپرت بلند',700000,4,12,'#fff1e6'],
['مانتو','مانتو مجلسی کرپ',950000,4,0,'#fdeaf4'],
['مانتو','مانتو جلوباز تابستانه',600000,6,30,'#e9f5f7'],
['شومیز','شومیز حریر یقه‌دار',320000,6,8,'#ffeaea'],
['شومیز','شومیز ساتن آستین‌پفی',400000,6,40,'#fdf3e1'],
['شومیز','شومیز نخی ساده',260000,8,18,'#eaf7ee'],
['بافت','پلیور بافت دورس',450000,4,5,'#f3eaff'],
['بافت','ژاکت بافت کش‌دار',500000,4,22,'#e8f0ff'],
['بافت','ست بافت دو تکه',800000,3,2,'#fdeaf4'],
['کت','کت تک جین',650000,4,10,'#e9f5f7'],
['کت','کت رسمی ساده',1050000,4,14,'#eef0f3'],
['کت','کت کوتاه تویید',900000,3,7,'#fff1e6']
].map(function(p,i){return {id:i,sid:i+1,cat:p[0],name:p[1],unit:p[2],pack:p[3],stock:p[4],bg:p[5],img:'',old:i%3===0?Math.round(p[2]*1.15/1000)*1000:0,desc:''}});
var cat='همه',cart=[],pend=null;
var sig=P.map(function(p){return p.id+':'+p.stock}).join(',');
try{var sv=JSON.parse(localStorage.getItem('almasStock')||'null');
 if(sv&&sv.sig===sig&&sv.s.length===P.length)P.forEach(function(p,i){p.stock=sv.s[i]})}catch(e){}
function saveStock(){if(API_URL)return;try{localStorage.setItem('almasStock',JSON.stringify({sig:sig,s:P.map(function(p){return p.stock})}))}catch(e){}}
function fa(x){return Math.round(x).toLocaleString('fa-IR')}
function pp(p){return p.unit*p.pack}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
var DISC='تخفیف‌ها';
function imgs(p){return String(p.img||'').split(',').map(function(x){return x.trim()}).filter(function(x){return /^[\w.\-]+$/.test(x)})}
function ph(p,src){var em=E[p.cat]||'🛍';return src?'<img src="images/'+src+'" alt="" loading="lazy" onerror="this.outerHTML=\''+em+'\'">':em}
function pic(p){return ph(p,imgs(p)[0])}
function disc(p){return p.old>p.unit?Math.round((1-p.unit/p.old)*100):0}
function inCart(id){var f=cart.filter(function(c){return c.id===id})[0];return f?f.q:0}
function nav(){
 var it=[['همه','🛍'],[DISC,'🔥']].concat(C.map(function(c){return [c,E[c]||'👗']}));
 document.getElementById('nav').innerHTML=it.map(function(x){
  return '<button class="sty'+(x[0]===cat?' on':'')+'" data-c="'+x[0].replace(/"/g,'&quot;')+'" onclick="setCat(this.dataset.c)"><i>'+x[1]+'</i><span>'+esc(x[0])+'</span></button>'}).join('');
}
function setCat(c){cat=c;nav();draw()}
function card(p){
 return '<div class="card" onclick="openProd('+p.id+')"><div class="im" style="background:'+p.bg+'">'+pic(p)+(disc(p)?'<span class="dc">'+fa(disc(p))+'٪</span>':'')+(p.stock<=0?'<span class="so">ناموجود</span>':'')+'</div>'+
 '<h3>'+esc(p.name)+'</h3><div class="pz">'+fa(p.unit)+' <small>تومان</small>'+(disc(p)?' <s>'+fa(p.old)+'</s>':'')+'</div>'+
 '<div class="ft"><span>'+fa(p.pack)+' عدد در یک پک</span>'+(p.stock>0&&p.stock<=3?'<em>'+fa(p.stock)+' پک مانده</em>':'')+'</div></div>';
}
function draw(){
 var q=document.getElementById('q').value.trim();
 var l=P.filter(function(p){return (cat==='همه'||(cat===DISC?disc(p)>0:p.cat===cat))&&(!q||p.name.indexOf(q)>-1)});
 document.getElementById('ttl').textContent=cat==='همه'?'همه‌ی محصولات':cat;
 document.getElementById('grid').innerHTML=l.length?l.map(card).join(''):'<p>کالایی پیدا نشد.</p>';
}
function add(id,n){
 n=n||1;
 if(inCart(id)+n>P[id].stock){alert('موجودی کافی نیست. موجودی انبار این کالا '+fa(P[id].stock)+' پک است.');return false}
 var f=cart.filter(function(c){return c.id===id})[0];
 if(f)f.q+=n;else cart.push({id:id,q:n});
 upd();
 var b=document.getElementById('n');b.style.transform='scale(1.4)';setTimeout(function(){b.style.transform=''},180);
 return true;
}
var cur=0,pq=1,mi=0;
function openProd(id){cur=id;pq=1;mi=0;renderProd();var d=document.getElementById('pd');d.classList.add('show');d.scrollTop=0;document.body.style.overflow='hidden'}
function closeProd(){document.getElementById('pd').classList.remove('show');document.body.style.overflow=''}
function setMi(i){mi=i;var k=document.scrollingElement?0:0;renderProd()}
function renderProd(){
 var p=P[cur],im=imgs(p),av=p.stock-inCart(cur),d=disc(p);
 if(pq>av)pq=Math.max(1,av);
 var th=im.length>1?im.map(function(x,i){return '<button class="th'+(i===mi?' on':'')+'" onclick="setMi('+i+')"><img src="images/'+x+'" alt=""></button>'}).join(''):'';
 var sim=P.filter(function(x){return x.cat===p.cat&&x.id!==p.id}).slice(0,8);
 document.getElementById('pdi').innerHTML=
 '<button class="bk" onclick="closeProd()">→ بازگشت</button><div class="pdg"><div><div class="mn" style="background:'+p.bg+'">'+ph(p,im[mi])+'</div><div class="ths">'+th+'</div></div>'+
 '<div class="inf"><h1>'+esc(p.name)+'</h1><div class="bd"><span class="'+(p.stock>0?'ok':'no')+'">'+(p.stock>0?'موجود: '+fa(p.stock)+' پک':'ناموجود')+'</span>'+(d?'<span class="dcb">'+fa(d)+'٪ تخفیف</span>':'')+'</div>'+
 '<div class="box"><div class="r"><span>قیمت هر عدد</span><b class="g">'+fa(p.unit)+' تومان'+(d?' <s>'+fa(p.old)+'</s>':'')+'</b></div><div class="r"><span>تعداد در پک</span><b>'+fa(p.pack)+' عدد</b></div><div class="r"><span>قیمت کل پک</span><b class="g">'+fa(pp(p))+' تومان'+(d?' <s>'+fa(p.old*p.pack)+'</s>':'')+'</b></div></div>'+
 '<div class="box"><div class="r"><span>دسته‌بندی</span><b>'+esc(p.cat)+'</b></div><div class="r"><span>کد محصول</span><b>'+esc(String(p.sid))+'</b></div></div>'+
 (p.desc?'<h3>توضیحات</h3><p class="ds">'+esc(p.desc)+'</p>':'')+'</div></div>'+
 (sim.length?'<div class="sim"><h3>محصولات مشابه</h3><div class="row">'+sim.map(card).join('')+'</div></div>':'')+
 '<div class="bar"><span>تعداد پک</span><div class="st"><button onclick="pqc(-1)">−</button><b id="pqv">'+fa(pq)+'</b><button onclick="pqc(1)">+</button></div><button class="ad" id="adb" onclick="addProd()"'+(av<=0?' disabled':'')+'>'+(av<=0?(p.stock<=0?'ناموجود':'همه‌ی موجودی در سبد است'):'🛒 افزودن به سبد')+'</button></div>';
}
function pqc(d){var av=P[cur].stock-inCart(cur);pq=Math.max(1,Math.min(Math.max(av,1),pq+d));document.getElementById('pqv').textContent=fa(pq)}
function addProd(){
 if(!add(cur,pq))return;
 pq=1;var b=document.getElementById('adb');b.textContent='✓ به سبد اضافه شد';
 setTimeout(function(){if(document.getElementById('pd').classList.contains('show'))renderProd()},900);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeProd()});
function chg(i,d){if(d>0&&cart[i].q>=P[cart[i].id].stock){alert('موجودی کافی نیست. موجودی انبار این کالا '+fa(P[cart[i].id].stock)+' پک است.');return}cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);upd()}
function total(){return cart.reduce(function(s,c){return s+pp(P[c.id])*c.q},0)}
function upd(){
 document.getElementById('n').textContent=fa(cart.reduce(function(s,c){return s+c.q},0));
 document.getElementById('tt').textContent=fa(total())+' تومان';
 document.getElementById('items').innerHTML=cart.length?cart.map(function(c,i){var p=P[c.id];
  return '<div class="it"><div class="e" style="background:'+p.bg+'">'+pic(p)+'</div><div class="n">'+p.name+'<br><small style="color:var(--mut)">پک '+fa(p.pack)+' تایی · '+fa(pp(p))+' تومان</small></div>'+
  '<div class="q"><button onclick="chg('+i+',1)">+</button>'+fa(c.q)+'<button onclick="chg('+i+',-1)">−</button></div></div>'}).join(''):'<div class="empty">سبد خرید شما خالی است</div>';
}
function openCart(){document.getElementById('ov').classList.add('show');document.getElementById('dr').classList.add('show')}
function closeCart(){document.getElementById('ov').classList.remove('show');document.getElementById('dr').classList.remove('show')}
function invNo(d){
 var y,m,dd,z=function(n){return ('0'+n).slice(-2)};
 try{
  var p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  var g=function(t){return p.filter(function(x){return x.type===t})[0].value};
  y=g('year');m=g('month');dd=g('day');
 }catch(e){y=d.getFullYear();m=z(d.getMonth()+1);dd=z(d.getDate())}
 var r;
 try{var a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0]%10000}catch(e){r=Math.floor(Math.random()*10000)}
 var t=y+z(m)+z(dd)+'-'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'-'+('000'+r).slice(-4);
 return t.replace(/\d/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'[c]});
}
var invHTML='',committed=false,curInv='';
function api(action,data){
 return fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action},data))}).then(function(r){return r.json()});
}
function applyProducts(list){
 var keep=cart.map(function(c){return {sid:P[c.id]&&P[c.id].sid,q:c.q}});
 P=list.map(function(p,i){return {id:i,sid:p.sid,cat:p.cat,name:p.name,unit:p.unit,pack:p.pack,stock:p.stock,bg:p.bg,img:p.img||'',old:Number(p.old)||0,desc:p.desc||''}});
 cart=keep.map(function(k){for(var i=0;i<P.length;i++){if(P[i].sid===k.sid)return {id:i,q:k.q}}return null}).filter(Boolean);
 C=[];P.forEach(function(p){if(C.indexOf(p.cat)<0)C.push(p.cat)});
 if(cat!=='همه'&&C.indexOf(cat)<0)cat='همه';
 nav();draw();upd();
}
function loadProducts(){
 fetch(API_URL+'?action=products&t='+Date.now()).then(function(r){return r.json()}).then(function(r){
  if(!r.ok)throw 0;applyProducts(r.products);
 }).catch(function(){document.getElementById('grid').innerHTML='<p>ارتباط با انبار برقرار نشد. اینترنت را بررسی کن و صفحه را دوباره باز کن.</p>'});
}
function setBusy(b){var x=document.getElementById('pay');x.disabled=b;x.textContent=b?'در حال ثبت سفارش...':'ثبت سفارش و نمایش فاکتور'}
function buildInv(num,d){
 var rows='',sum=0,pieces=0,packs=0;
 cart.forEach(function(c,i){var p=P[c.id],t=pp(p)*c.q;sum+=t;pieces+=p.pack*c.q;packs+=c.q;
  rows+='<tr><td>'+fa(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+fa(c.q)+'</td><td>'+fa(p.pack)+'</td><td>'+fa(p.unit)+'</td><td>'+fa(t)+'</td></tr>'});
 invHTML='<h2 style="margin:0;color:#2563eb">💎 '+esc(S.name)+' <small style="font-size:14px;color:#81858b">عمده‌فروشی پوشاک زنانه</small></h2>'+
 '<div class="meta"><span>فاکتور فروش شماره <bdi dir="ltr">'+num+'</bdi></span><span>تاریخ: '+d.toLocaleDateString('fa-IR')+' · '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'</span></div>'+
 '<div class="sh">آدرس: '+esc(S.address)+'<br>تلفن: '+S.phone.split('|').map(function(t){return '<bdi dir="ltr">'+esc(t.trim())+'</bdi>'}).join('<br>')+'<br>ساعت کاری: '+esc(S.hours)+'</div>'+
 '<div class="by">خریدار: <b>'+(esc(document.getElementById('cn').value)||'—')+'</b> · تلفن: '+(esc(document.getElementById('cp').value)||'—')+'</div>'+
 '<div class="tw"><table><thead><tr><th>ردیف</th><th>شرح کالا</th><th>تعداد پک</th><th>تعداد در پک</th><th>قیمت هر عدد</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
 '<div class="sum"><div><span>جمع پک‌ها</span><span>'+fa(packs)+'</span></div><div><span>جمع کل تعداد (عدد)</span><span>'+fa(pieces)+'</span></div><div class="g"><span>مبلغ قابل پرداخت</span><span>'+fa(sum)+' تومان</span></div></div>';
 document.getElementById('paper').innerHTML=invHTML;
}
function showInv(){closeCart();document.getElementById('inv').classList.add('show')}
function invoice(){
 if(!cart.length){alert('سبد خرید خالی است.');return}
 for(var k=0;k<cart.length;k++){if(cart[k].q>P[cart[k].id].stock){alert('موجودی «'+P[cart[k].id].name+'» کافی نیست. موجودی انبار: '+fa(P[cart[k].id].stock)+' پک');return}}
 var items=cart.map(function(c){return {sid:P[c.id].sid,q:c.q}});
 var sg=JSON.stringify(items);
 if(!pend||pend.sg!==sg){var d0=new Date();pend={sg:sg,d:d0,num:invNo(d0)}}
 var num=pend.num,d=pend.d;
 if(!API_URL){ // حالت بدون اتصال: موجودی فقط در همین مرورگر
  buildInv(num,d);cart.forEach(function(c){P[c.id].stock-=c.q});saveStock();committed=true;pend=null;draw();showInv();return;
 }
 setBusy(true);
 api('order',{inv:num,name:document.getElementById('cn').value,phone:document.getElementById('cp').value,items:items}).then(function(r){
  setBusy(false);pend=null;
  if(r.products)applyProducts(r.products);
  if(!r.ok){alert(r.error||'ثبت سفارش انجام نشد.');return}
  curInv=num;committed=true;buildInv(num,d);showInv();
 }).catch(function(){setBusy(false);alert('ارتباط با سرور برقرار نشد. اینترنت را بررسی کن و دوباره دکمه‌ی ثبت سفارش را بزن.')});
}
// چاپ: همین صفحه چاپ می‌شود و با CSS (بخش @media print) فقط فاکتور دیده می‌شود
function printInv(){window.print()}
function editCart(){
 function back(){document.getElementById('inv').classList.remove('show');openCart()}
 if(!committed){back();return}
 if(!API_URL){cart.forEach(function(c){P[c.id].stock+=c.q});saveStock();committed=false;draw();back();return}
 api('cancel',{inv:curInv}).then(function(r){
  if(!r.ok){alert(r.error||'لغو سفارش انجام نشد.');return}
  if(r.products)applyProducts(r.products);
  committed=false;back();
 }).catch(function(){alert('ارتباط با سرور برقرار نشد. دوباره تلاش کن.')});
}
function done(){committed=false;curInv='';cart=[];upd();draw();document.getElementById('inv').classList.remove('show')}
// بخش اطلاعات مغازه (هر شماره در یک خط جدا و با لینک تماس مخصوص خودش)
(function(){
 var tel=S.phone.split('|').map(function(t){t=t.trim();return /[0-9۰-۹]/.test(t)?'<a href="tel:'+t.replace(/[^0-9+]/g,'')+'">'+esc(t)+'</a>':esc(t)}).join('<br>');
 document.getElementById('info').innerHTML=
 '<div><b>📍 آدرس مغازه</b><span>'+esc(S.address)+'</span></div>'+
 '<div><b>🕘 ساعت کاری</b><span>'+esc(S.hours)+'</span></div>'+
 '<div><b>📞 شماره تماس</b><span>'+tel+'</span></div>';
})();
document.getElementById('shn').textContent=S.shop;
if(API_URL){document.getElementById('grid').innerHTML='<p>در حال بارگذاری محصولات...</p>';nav();upd();loadProducts()}else{nav();draw();upd()}
</script>
