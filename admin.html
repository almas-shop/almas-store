<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>افزودن محصول | الماس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4ff;color:#23254e;font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
.w{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:6px 0 16px}
.c{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,64,175,.08)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d5dbe8;border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #2563eb;border-color:#2563eb}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small{color:#81858b;font-weight:400}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.go:disabled{background:#9db8ee}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pv img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #d5dbe8}
#msg{margin-top:12px;padding:12px;border-radius:10px;display:none;font-size:15px}
#msg.ok{display:block;background:#dcfce7;color:#166534}
#msg.er{display:block;background:#fee2e2;color:#991b1b}
#msg.wt{display:block;background:#e0e9ff;color:#1e3a8a}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="w">
<h1>💎 افزودن محصول جدید</h1>

<details class="c" id="set">
<summary>تنظیمات (فقط بار اول)</summary>
<label>رمز مدیریت <small>(همون رمزی که توی Apps Script گذاشتی)</small></label>
<input id="pw" type="password" autocomplete="off">
<label>توکن گیت‌هاب <small>(برای آپلود عکس)</small></label>
<input id="tk" type="password" autocomplete="off">
<small>این دو مورد فقط توی همین مرورگر ذخیره می‌شن.</small>
</details>

<div class="c">
<label>دسته</label>
<select id="cat"><option>شلوار</option><option>مانتو</option><option>شومیز</option><option>بافت</option><option>کت</option></select>
<label>نام محصول</label>
<input id="nm" placeholder="مثلاً مانتو اسپرت بلند">
<div class="r">
<div><label>قیمت هر عدد <small>(تومان)</small></label><input id="un" type="number" inputmode="numeric"></div>
<div><label>تعداد در هر پک</label><input id="pk" type="number" inputmode="numeric"></div>
<div><label>موجودی <small>(تعداد پک)</small></label><input id="st" type="number" inputmode="numeric"></div>
<div><label>قیمت قبلی <small>(اگر تخفیف دارد)</small></label><input id="od" type="number" inputmode="numeric"></div>
</div>
<label>توضیحات <small>(اختیاری)</small></label>
<textarea id="ds" rows="3"></textarea>
<label>عکس‌ها <small>(یک یا چند عکس؛ اولی عکس اصلی است)</small></label>
<input id="im" type="file" accept="image/*" multiple>
<div class="pv" id="pv"></div>
<button class="go" id="go" onclick="send()">ذخیره محصول</button>
<div id="msg"></div>
</div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbzDaU9fI0kofUfbbS2XQ1XUlabiY32t3av2BaZtGIRZbaM3CzxS1msET6d9X1KroEtT/exec';
var REPO='almas-shop/almas-store';
var COLORS=['#e8f0ff','#eaf7ee','#f3eaff','#fff1e6','#fdeaf4','#e9f5f7','#ffeaea','#fdf3e1'];
function $(i){return document.getElementById(i)}
try{$('pw').value=localStorage.getItem('apw')||'';$('tk').value=localStorage.getItem('atk')||'';if(!$('pw').value||!$('tk').value)$('set').open=true}catch(e){}
function msg(t,c){var m=$('msg');m.className=c;m.textContent=t}
$('im').onchange=function(){
 $('pv').innerHTML='';
 Array.prototype.forEach.call(this.files,function(f){var i=document.createElement('img');i.src=URL.createObjectURL(f);$('pv').appendChild(i)});
};
// کوچک‌کردن عکس تا عرض ۹۰۰ پیکسل و تبدیل به jpg
function shrink(f){
 return new Promise(function(ok,no){
  var i=new Image();
  i.onload=function(){
   var s=Math.min(1,900/i.width),c=document.createElement('canvas');
   c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
   c.getContext('2d').drawImage(i,0,0,c.width,c.height);
   ok(c.toDataURL('image/jpeg',0.85).split(',')[1]);
  };
  i.onerror=function(){no(new Error('فایل عکس خوانده نشد'))};
  i.src=URL.createObjectURL(f);
 });
}
function upload(name,b64,tk){
 return fetch('https://api.github.com/repos/'+REPO+'/contents/images/'+name,{
  method:'PUT',
  headers:{'Authorization':'Bearer '+tk,'Accept':'application/vnd.github+json'},
  body:JSON.stringify({message:'Add product image '+name,content:b64})
 }).then(function(r){if(!r.ok)throw new Error('آپلود عکس انجام نشد. توکن گیت‌هاب را بررسی کن.')});
}
async function send(){
 var pw=$('pw').value.trim(),tk=$('tk').value.trim();
 var nm=$('nm').value.trim(),un=+$('un').value,pk=+$('pk').value,st=$('st').value===''?NaN:+$('st').value;
 var files=$('im').files;
 if(!pw){$('set').open=true;return msg('رمز مدیریت را در بخش تنظیمات بنویس.','er')}
 if(!nm||!(un>0)||!(pk>0)||isNaN(st)||st<0)return msg('نام، قیمت، تعداد در پک و موجودی را کامل پر کن.','er');
 if(files.length&&!tk){$('set').open=true;return msg('برای آپلود عکس، توکن گیت‌هاب لازم است.','er')}
 try{localStorage.setItem('apw',pw);localStorage.setItem('atk',tk)}catch(e){}
 $('go').disabled=true;
 try{
  var names=[],stamp=Date.now().toString(36);
  for(var k=0;k<files.length;k++){
   msg('در حال آپلود عکس '+(k+1)+' از '+files.length+'...','wt');
   var n='p'+stamp+'-'+(k+1)+'.jpg';
   await upload(n,await shrink(files[k]),tk);names.push(n);
  }
  msg('در حال ثبت در شیت...','wt');
  var p={cat:$('cat').value,name:nm,unit:un,pack:pk,stock:st,old:+$('od').value||0,desc:$('ds').value.trim(),img:names.join(','),bg:COLORS[Math.floor(Math.random()*COLORS.length)]};
  var r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'addProduct',password:pw,product:p})}).then(function(x){return x.json()});
  if(!r.ok)throw new Error(r.error||'ثبت در شیت انجام نشد.');
  msg('✓ محصول «'+nm+'» ثبت شد.'+(names.length?' عکس‌ها بعد از ۱ تا ۲ دقیقه در سایت دیده می‌شن.':''),'ok');
  ['nm','un','pk','st','od','ds','im'].forEach(function(i){$(i).value=''});$('pv').innerHTML='';
 }catch(e){msg(e.message||'خطا در ارتباط. دوباره امتحان کن.','er')}
 $('go').disabled=false;
}
</script>
</body>
</html>
